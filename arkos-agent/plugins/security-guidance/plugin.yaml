name: security-guidance
version: "0.1.0"
description: "Append security warnings to file-write tool results when the new content contains known-dangerous patterns (pickle.load, yaml.load, eval(, os.system, dangerouslySetInnerHTML, verify=False, ECB, XXE, GitHub Actions injection, ...). 25 regex/substring rules. Source and license notices are included with the plugin. Non-blocking — the file is written and the warning rides back to the model in the next turn so it can self-correct."
author: Arkos distribution
hooks:
  - transform_tool_result
  - pre_tool_call
